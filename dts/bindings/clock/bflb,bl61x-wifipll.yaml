description: The BL61x WIFI PLL

compatible: "bflb,bl61x-wifipll"

include: [base.yaml, clock-controller.yaml]

properties:
  clocks:
    type: phandle-array
    required: true
    description: source

  overclock:
    type: boolean
    description: |
      Overclock PLL to 480MHz for div ID 1 and 360MHz for div ID 2
      BCLK divider MUST be set so BCLK is 80MHz or slower
      Breaks most complex peripherals (USB, Wifi)

  "#clock-cells":
    const: 0
