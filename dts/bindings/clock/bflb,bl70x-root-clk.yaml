description: |
  The BL70x Root Clock

compatible: "bflb,bl70x-root-clk"

include: [base.yaml, clock-controller.yaml]

properties:
  clocks:
    type: phandle-array
    required: true
    description: source

  dll-select:
    type: int
    required: true
    enum:
      - 0
      - 1
      - 2
    description: |
      Select DLL divider ID
      0 = 57.6M, 1 = 96M, 2 = 144M

  divider:
    type: int
    required: true
    description: Divide source clock by this 8-bits value. Typically 1.
