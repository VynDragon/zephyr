title: Panchip PAN3029 ChirpIoT Modem on SPI bus

description: |
  Panchip PAN3029 ChirpIoT Modem. It supports up to 20dBm of transmit power over the
  137-1110MHz sub-GHz ISM bands, sensitivity as low as -143dBm, spreading factors 5 to 12,
  and bandwidths of 62.5KHz, 125KHz, 250KHz, and 500KHz.
  It has limited compatibility with LoRa modulation.

compatible: "panchip,pan3029"

include: ["panchip,pan30xx-base.yaml", "spi-device.yaml"]
