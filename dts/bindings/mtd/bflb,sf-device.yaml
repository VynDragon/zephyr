title: Bouffalolab Serial Flash controller device

description: |
  Bouffalolab Serial Flash controller device
  QPI (Quad I/O for everything) mode is unsupported by the driver
  Continuous read support is experimental.

compatible: "bflb,sf-device"

include:
  - flash-controller.yaml
  - pinctrl-device.yaml

properties:
  reg:
    required: true

  sf-pad:
    type: int
    required: true
    description: |
      Which pad is this device holding. This is directly related to which pins are used.
      Pad 1 is usually the embedded flash, Pad 2 and Pad 3 are usually external.
      Main exception is BL70x where the default embedded pad is SF2.
    enum:
      - 1
      - 2
      - 3

  spi-bus-mode:
    type: int
    required: true
    description: |
     The width and mode of SPI bus to which the device is connected.
     Numbers refer to the number of line used in each direction.

     Possible values are:
      - IO <0> = x-1-1 mode
      - DO <1> = x-1-2 mode
      - QO <2> = x-1-4 mode
      - DIO <3> = x-2-2 mode
      - QIO <4> = x-4-4 mode

      x is always 1 with the current driver. The hardware supports QPI where x is 4.

    enum:
      - 0
      - 1
      - 2
      - 3
      - 4

  read-command:
    type: int
    description: |
      SPI command to use for memory-mapped reading.

  read-dummy-cycles:
    type: int
    description: |
      Dummy cycles for automatic read mode. They are expressed in bytes (8 cycles).

  continuous-read-command:
    type: int
    description: |
      Enable continuous read using this command setting.

  write-command:
    type: int
    description: |
      SPI command to use for memory-mapped writing. Device must not require explicit or page sized
      erase.

  write-dummy-cycles:
    type: int
    description: |
      Dummy cycles for automatic write mode. They are expressed in bytes (8 cycles).

  initialization-sequence:
    type: array
    description: |
      Triples of command, data, datalength writes to set things up at setup time.
      For example to clear out block protection, or setup dummy timing.
      up to 4 bytes of data can be sent at once.
      Remember the byte order is inverted (right to left).
      Example of setting OC bits to 11 and disabling block protections on MX25L25645G:
      initialization-sequence = <0x06 0x0 0x0 0x1 0xc002 0x2>;
      If using this on internal flash this can be VERY dangerous, devcube / eflash loader is able
      to recover register settings in case of needs.

  read-delay:
    type: int
    default: 1
    enum:
      - 0
      - 1
      - 2
      - 3
      - 4
    description: Flash Read delay.
      This may be necessary to achieve flash clock higher than XCLK.

  clock-invert:
    type: boolean
    description: Invert Clock Signal.
      This may be necessary to achieve flash clock higher than XCLK.

  rx-clock-invert:
    type: boolean
    description: Invert RX Clock Signal.
      This may be necessary to achieve flash clock higher than XCLK.

  jedec-id:
    type: uint8-array
    description: JEDEC ID as manufacturer ID, memory type, memory density
